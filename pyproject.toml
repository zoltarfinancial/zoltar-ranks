[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoltar-ranks"
version = "0.1.0"
description = "Point-in-time rank archive, benchmark and execution-timing research loop for Zoltar Financial"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["network: hits the upstream GitHub repo"]
